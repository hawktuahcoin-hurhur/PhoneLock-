# Generate the Xcode project with:  brew install xcodegen && xcodegen
# Then set BUNDLE_ID_PREFIX and DEVELOPMENT_TEAM below (or in Xcode) before running on a device.
name: PhoneLock
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    BUNDLE_ID_PREFIX: com.example
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  PhoneLock:
    type: application
    platform: iOS
    sources:
      - PhoneLock
      - Shared
    info:
      path: PhoneLock/Info.plist
      properties:
        CFBundleDisplayName: PhoneLock
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        AppGroupID: group.$(BUNDLE_ID_PREFIX).phonelock
    entitlements:
      path: PhoneLock/PhoneLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).phonelock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).phonelock
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: DeviceActivityMonitor
      - target: ShieldConfiguration

  # Re-locks apps at midnight and when an emergency pass expires, even if the app is closed.
  DeviceActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityMonitor
      - Shared
    info:
      path: DeviceActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: PhoneLock Monitor
        AppGroupID: group.$(BUNDLE_ID_PREFIX).phonelock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PhoneLockMonitor
    entitlements:
      path: DeviceActivityMonitor/DeviceActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).phonelock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).phonelock.monitor

  # Custom "go study first" screen shown when a locked app is opened.
  ShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfiguration
      - Shared
    info:
      path: ShieldConfiguration/Info.plist
      properties:
        CFBundleDisplayName: PhoneLock Shield
        AppGroupID: group.$(BUNDLE_ID_PREFIX).phonelock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PhoneLockShield
    entitlements:
      path: ShieldConfiguration/ShieldConfiguration.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).phonelock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).phonelock.shield
